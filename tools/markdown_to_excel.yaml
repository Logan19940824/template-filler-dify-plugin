identity:
  name: markdown_to_excel
  author: modsdom
  label:
    en_US: Markdown to Excel
    zh_Hans: Markdown 转 Excel
    pt_BR: Markdown para Excel
    ja_JP: Markdown から Excel
description:
  human:
    en_US: Convert Markdown tables to an Excel XLSX workbook and return a download link.
    zh_Hans: 将 Markdown 表格转换为 Excel XLSX 工作簿并返回下载链接。
    pt_BR: Converter tabelas Markdown em uma pasta de trabalho Excel XLSX e retornar um link de download.
    ja_JP: Markdown テーブルを Excel XLSX ブックに変換してダウンロードリンクを返します。
  llm: Convert each Markdown table into a formatted Excel worksheet. If there are no tables, export the document outline as rows, upload the workbook to Dify, and return its download link.
parameters:
  - name: markdown_content
    type: string
    required: true
    label:
      en_US: Markdown content
      zh_Hans: Markdown 内容
      pt_BR: Conteúdo Markdown
      ja_JP: Markdown 内容
    human_description:
      en_US: Markdown text containing one or more tables.
      zh_Hans: 包含一个或多个表格的 Markdown 文本。
      pt_BR: Texto Markdown contendo uma ou mais tabelas.
      ja_JP: 1 つ以上のテーブルを含む Markdown テキスト。
    llm_description: Complete Markdown source text to convert to XLSX.
    form: llm
  - name: output_filename
    type: string
    required: false
    label:
      en_US: Output filename
      zh_Hans: 输出文件名
      pt_BR: Nome do arquivo
      ja_JP: 出力ファイル名
    human_description:
      en_US: Optional XLSX filename.
      zh_Hans: 可选的 XLSX 文件名。
      pt_BR: Nome opcional do arquivo XLSX.
      ja_JP: 任意の XLSX ファイル名。
    llm_description: Optional output filename; the .xlsx extension is added when omitted.
    form: llm
extra:
  python:
    source: tools/markdown_to_excel.py
