identity:
  name: markdown_to_word
  author: modsdom
  label:
    en_US: Markdown to Word
    zh_Hans: Markdown 转 Word
    pt_BR: Markdown para Word
    ja_JP: Markdown から Word
description:
  human:
    en_US: Convert Markdown text to a Word DOCX document and return a download link.
    zh_Hans: 将 Markdown 文本转换为 Word DOCX 文档并返回下载链接。
    pt_BR: Converter texto Markdown em um documento Word DOCX e retornar um link de download.
    ja_JP: Markdown テキストを Word DOCX 文書に変換してダウンロードリンクを返します。
  llm: Convert Markdown headings, paragraphs, emphasis, lists, quotes, code blocks, and tables to a Word DOCX file, upload it to Dify, and return its download link.
parameters:
  - name: markdown_content
    type: string
    required: true
    label:
      en_US: Markdown content
      zh_Hans: Markdown 内容
      pt_BR: Conteúdo Markdown
      ja_JP: Markdown 内容
    human_description:
      en_US: Markdown text to convert.
      zh_Hans: 要转换的 Markdown 文本。
      pt_BR: Texto Markdown a converter.
      ja_JP: 変換する Markdown テキスト。
    llm_description: Complete Markdown source text to convert to DOCX.
    form: llm
  - name: output_filename
    type: string
    required: false
    label:
      en_US: Output filename
      zh_Hans: 输出文件名
      pt_BR: Nome do arquivo
      ja_JP: 出力ファイル名
    human_description:
      en_US: Optional DOCX filename.
      zh_Hans: 可选的 DOCX 文件名。
      pt_BR: Nome opcional do arquivo DOCX.
      ja_JP: 任意の DOCX ファイル名。
    llm_description: Optional output filename; the .docx extension is added when omitted.
    form: llm
extra:
  python:
    source: tools/markdown_to_word.py
